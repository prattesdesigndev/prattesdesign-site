<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#1c1c1c"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </radialGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="6" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.55"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect fill="url(#bg)" width="640" height="440"/>
  <image x="300" y="0" width="400" height="200" opacity="0.05" preserveAspectRatio="xMidYMid meet" href="data:image/png;base64,"/>
  
  <!-- ===== Laptop com landing page (centro) ===== -->
  <g transform="translate(80 60)" filter="url(#sh)">
    <!-- monitor frame -->
    <rect width="430" height="270" rx="10" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1"/>
    
    <!-- top bar (browser) -->
    <rect width="430" height="22" rx="10" fill="#0a0a0a"/>
    <rect y="12" width="430" height="10" fill="#0a0a0a"/>
    <circle cx="14" cy="11" r="3" fill="#ff5f56"/>
    <circle cx="26" cy="11" r="3" fill="#ffbd2e"/>
    <circle cx="38" cy="11" r="3" fill="#27c93f"/>
    <rect x="120" y="5" width="200" height="12" rx="6" fill="#222"/>
    <text x="220" y="14" text-anchor="middle" font-family="ui-monospace, 'Courier New', monospace" font-size="6" fill="#888">🔒 mentoria.especialista.com</text>
    
    <!-- LP content (white background) -->
    <rect x="0" y="22" width="430" height="248" fill="#0a0a0a"/>
    
    <!-- Hero da LP -->
    <text x="20" y="55" font-family="ui-monospace, 'Courier New', monospace" font-size="6" letter-spacing="0.3em" fill="#FFDA00" font-weight="700">/MENTORIA · TURMA 03</text>
    
    <!-- Big headline -->
    <text x="20" y="92" font-family="Inter, system-ui, -apple-system, sans-serif" font-weight="900" font-size="22" fill="#fff" letter-spacing="-0.025em">De especialista</text>
    <text x="20" y="116" font-family="Inter, system-ui, -apple-system, sans-serif" font-weight="900" font-size="22" fill="#FFDA00" letter-spacing="-0.025em">a referência.</text>
    
    <text x="20" y="138" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="9" fill="#bbb">Mentoria de 12 semanas pra escalar</text>
    <text x="20" y="150" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="9" fill="#bbb">sua autoridade no mercado.</text>
    
    <!-- CTA button -->
    <rect x="20" y="166" width="140" height="32" rx="16" fill="#FFDA00"/>
    <text x="90" y="186" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" 
          font-size="10" font-weight="700" fill="#0a0a0a" letter-spacing="0.1em">QUERO PARTICIPAR →</text>
    
    <!-- Trust badges -->
    <g transform="translate(20 215)" font-family="ui-monospace, 'Courier New', monospace" font-size="6" fill="#888">
      <circle cx="3" cy="3" r="2" fill="#FFDA00"/>
      <text x="10" y="6">200+ alunas</text>
      <circle cx="73" cy="3" r="2" fill="#FFDA00"/>
      <text x="80" y="6">95% recomendam</text>
      <circle cx="173" cy="3" r="2" fill="#FFDA00"/>
      <text x="180" y="6">12 semanas</text>
    </g>
    
    <!-- Vídeo embed (lado direito da LP) -->
    <g transform="translate(220 50)">
      <rect width="190" height="200" fill="#000"/>
      <rect width="190" height="200" fill="url(#vidGrad)" opacity="0.8"/>
      <defs>
        <linearGradient id="vidGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#1a3a52"/>
          <stop offset="100%" stop-color="#0a0a0a"/>
        </linearGradient>
      </defs>
      
      <!-- silhueta abstrata simulando vídeo da especialista -->
      <ellipse cx="95" cy="85" rx="32" ry="38" fill="#3a4a5a" opacity="0.6"/>
      <ellipse cx="95" cy="135" rx="55" ry="40" fill="#2a3a4a" opacity="0.6"/>
      
      <!-- play button overlay -->
      <circle cx="95" cy="100" r="22" fill="rgba(255,218,0,0.2)" stroke="#FFDA00" stroke-width="1.5"/>
      <polygon points="88,90 88,110 105,100" fill="#FFDA00"/>
      
      <!-- video timer -->
      <rect x="6" y="180" width="40" height="12" rx="2" fill="rgba(0,0,0,0.6)"/>
      <text x="26" y="189" text-anchor="middle" font-family="ui-monospace, 'Courier New', monospace" font-size="6" fill="#fff">02:38</text>
      
      <!-- legend -->
      <text x="180" y="14" text-anchor="end" font-family="ui-monospace, 'Courier New', monospace" font-size="5" fill="#FFDA00" font-weight="700">▸ ASSISTA</text>
    </g>
  </g>
  
  <!-- Laptop base/keyboard hint -->
  <g transform="translate(80 330)">
    <rect width="430" height="6" rx="3" fill="#0f0f0f"/>
    <ellipse cx="215" cy="9" rx="10" ry="2" fill="#000"/>
  </g>
  
  <!-- ===== Card flutuante: analytics (canto inferior direito) ===== -->
  <g transform="translate(440 320) rotate(-5)" filter="url(#sh)">
    <rect width="170" height="92" rx="8" fill="#FFDA00"/>
    <text x="14" y="20" font-family="ui-monospace, 'Courier New', monospace" font-size="7" 
          letter-spacing="0.25em" fill="#0a0a0a" font-weight="700">/CONVERSÃO LP</text>
    <text x="14" y="52" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="32" 
          font-weight="900" fill="#0a0a0a" letter-spacing="-0.04em">12.4%</text>
    <text x="14" y="68" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="8" fill="#0a0a0a">vs. 2.1% (média)</text>
    <text x="14" y="82" font-family="ui-monospace, 'Courier New', monospace" font-size="6" fill="#0a0a0a" font-weight="700">↗ 5.9x acima da média</text>
  </g>
  
  <!-- Cinta -->
  <g transform="translate(40 400)">
    <rect width="200" height="22" fill="#FFDA00"/>
    <text x="10" y="15" font-family="ui-monospace, 'Courier New', monospace" font-size="9" 
          font-weight="bold" letter-spacing="0.15em" fill="#0a0a0a">CASE 04 · LAUNCH + LP</text>
  </g>
</svg>