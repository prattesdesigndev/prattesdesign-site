<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380">
  <defs>
    <radialGradient id="bgA" cx="50%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#1c1c1c"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </radialGradient>
    <filter id="shadowA" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="6" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.6"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Gradiente pra waveform -->
    <linearGradient id="wave" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFDA00" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFDA00" stop-opacity="0.3"/>
    </linearGradient>
  </defs>
  
  <rect fill="url(#bgA)" width="600" height="380"/>
  <ellipse cx="100" cy="320" rx="200" ry="100" fill="#FFDA00" opacity="0.05"/>
  
  <!-- ===== Tela principal: editor de vídeo (atrás) ===== -->
  <g transform="translate(70 35)" filter="url(#shadowA)">
    <!-- monitor frame -->
    <rect width="380" height="240" rx="6" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1"/>
