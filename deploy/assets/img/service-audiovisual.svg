    </g>
    
    <!-- playhead -->
    <line x1="180" y1="172" x2="180" y2="226" stroke="#FFDA00" stroke-width="1.2"/>
    <polygon points="174,170 186,170 180,176" fill="#FFDA00"/>
  </g>
  
  <!-- ===== Card flutuante: KPIs de tráfego ===== -->
  <g transform="translate(390 220) rotate(-3)" filter="url(#shadowA)">
    <rect width="180" height="135" rx="8" fill="#0f0f0f" stroke="#2a2a2a" stroke-width="1"/>
    <text x="14" y="22" font-family="ui-monospace, 'Courier New', monospace" font-size="6" 
          letter-spacing="0.25em" fill="#FFDA00" font-weight="700">/ADS DASHBOARD</text>
    <text x="14" y="42" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="9" 
          fill="#888">Campanha · Conversões</text>
    
    <!-- big number -->
